# Render Blueprint: frontend и API размещаются на одном site-domain (onrender.com).
services:
  - type: web
    name: dnd-dcorp-web
    runtime: static
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_URL
        value: https://dnd-dcorp-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: dnd-dcorp-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://dnd-dcorp-web.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dnd-dcorp-db
          property: connectionString
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false

databases:
  - name: dnd-dcorp-db
    databaseName: dnd_dcorp
    user: dnd_dcorp
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []
